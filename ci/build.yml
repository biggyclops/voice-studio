name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch ffmpeg (static, both archs) and make a universal sidecar
        run: |
          set -e
          mkdir -p src-tauri/binaries tmp
          curl -fsSL -o tmp/arm.zip https://www.osxexperts.net/ffmpeg902arm.zip
          curl -fsSL -o tmp/intel.zip https://www.osxexperts.net/ffmpeg80intel.zip
          unzip -o -q tmp/arm.zip -d tmp/arm
          unzip -o -q tmp/intel.zip -d tmp/intel
          ARM=$(find tmp/arm -type f -name ffmpeg | head -1)
          INTEL=$(find tmp/intel -type f -name ffmpeg | head -1)
          lipo -info "$ARM"; lipo -info "$INTEL"
          lipo -create "$ARM" "$INTEL" -output src-tauri/binaries/ffmpeg-universal-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-universal-apple-darwin
          lipo -info src-tauri/binaries/ffmpeg-universal-apple-darwin
          src-tauri/binaries/ffmpeg-universal-apple-darwin -version | head -1

      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin

      - name: Find dmg
        id: dmg
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-${{ steps.dmg.outputs.version }}-universal-dmg
          path: ${{ steps.dmg.outputs.path }}

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v${{ steps.dmg.outputs.version }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.dmg.outputs.path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.dmg.outputs.path }}" --title "Voice Studio $TAG" --notes "Universal macOS build (unsigned: right-click > Open the first time)."
          fi
